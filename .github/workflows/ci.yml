name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://darukaa:darukaa@localhost:5432/darukaa_test
      JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app tests

      - name: Check formatting with black
        run: black --check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://placeholder-api.example.com
          VITE_MAPBOX_TOKEN: placeholder-token
