services:
  - type: web
    name: darukaa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render's own free Postgres expires after 30 days. Use a permanent
      # free PostGIS-enabled database instead (e.g. Aiven) and paste its
      # connection string here during the Blueprint deploy, or in the
      # dashboard afterward under Environment.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: https://darukaa-earth.vercel.app
