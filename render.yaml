databases:
  - name: darukaa-postgis
    databaseName: darukaa
    user: darukaa
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: darukaa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: https://darukaa-earth.vercel.app
